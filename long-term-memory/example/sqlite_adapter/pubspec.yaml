name: sqlite_memory_store
description: >-
  Example MemoryStore adapter for the long_term_memory package backed by
  package:sqlite3 — WAL, transactions, rotating backups and vacuum included.
  Copy it into your app and adapt freely (it also works with sqlite3_flutter_libs
  on mobile).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.4.0

dependencies:
  long_term_memory:
    path: ../..
  sqlite3: ^2.4.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
