[package]
name = "llm-long-term-memory"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "ENGRAM v2.1: a trace-based long-term memory engine for LLM applications. Bring your own embedding model, LLM and database."
license = "MIT"
repository = "https://github.com/CubeEarthWorld/llm-long-term-memory"
readme = "README.md"
exclude = ["bench/", "data/", "model/", "secrets/"]

[lib]
name = "engram"

[dependencies]
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
ulid = "3.0.0"

[workspace]
members = ["bench"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
