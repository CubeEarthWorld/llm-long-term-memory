[package]
name = "ltm-bench"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "Benchmarks and a headless runner for the engram crate: SQLite store, llama.cpp embeddings, Claude Code as the LLM."
license = "MIT"
publish = false

[lib]
name = "ltm"

[[bin]]
name = "ltm"
path = "src/main.rs"

[features]
# Offload the embedding model to an NVIDIA GPU (needs the CUDA toolkit at build time).
cuda = ["llama-cpp-2/cuda"]

[dependencies]
llm-long-term-memory = { path = ".." }
llama-cpp-2 = { version = "0.1.159", default-features = false, features = ["openmp"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
ulid = "3.0.0"
rand = "0.10.3"
redb = "2.6.4"
