[project]
name = "llm-long-term-memory"
version = "1.0.1"
description = "ENGRAM v2: a trace-based long-term memory engine for LLM applications, with a local FastAPI app."
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["frontend", "model", "data"]

[tool.ruff.lint]
select = ["F401", "F811", "F841"]
